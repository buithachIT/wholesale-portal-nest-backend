name: b2b-wholesale

services:
  postgres:
    profiles: [with-db]
    image: postgres:16-alpine
    container_name: b2b_wholesale_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: b2b_wholesale_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${API_PUBLISH_PORT:-127.0.0.1:3010}:3000'
    networks:
      - app_net

volumes:
  postgres_data:

networks:
  app_net:
