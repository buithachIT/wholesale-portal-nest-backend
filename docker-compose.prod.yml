name: b2b-wholesale

services:
  postgres:
    profiles: [with-db]
    image: postgres:16-alpine
    container_name: b2b_wholesale_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-b2b_logistics_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-ecommerce} -d ${POSTGRES_DB:-b2b_logistics_db}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: b2b_wholesale_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${API_PUBLISH_PORT:-127.0.0.1:3010}:3000'
    networks:
      - app_net
      - ecommerce
      - npm

volumes:
  postgres_data:

networks:
  app_net:
  ecommerce:
    external: true
    name: ${DB_NETWORK:-api-ecommerce_ecommerce}
  npm:
    external: true
    name: ${NPM_NETWORK:-nginx-proxy-manager_default}
